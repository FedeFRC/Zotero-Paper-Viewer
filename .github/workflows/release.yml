name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release tag
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $($package.version). Expected $expectedTag."
          }

      - name: Build XPI
        run: npm run build

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $version = $package.version
          $asset = "dist/paper-viewer-$version.xpi"
          gh release create $env:GITHUB_REF_NAME $asset `
            --title "Paper Viewer $version" `
            --notes "Paper Viewer $version release." `
            --latest
